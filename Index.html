<style>
  @import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@300;400;500&display=swap');

  :root {
    --bg: #0e0e0e;
    --surface: #161616;
    --surface2: #1f1f1f;
    --border: #2a2a2a;
    --accent: #38d8f0;
    --accent2: #a855f7;
    --text: #e8e8e8;
    --muted: #666;
    --unused-bg: #1a0f00;
    --unused-border: #ff6b35;
    --unused-glow: rgba(255, 107, 53, 0.15);
    --mark-color: #e8ff47;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'IBM Plex Sans', sans-serif;
    height: 100vh;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  /* ── TOP BAR ─────────────────────────────────────── */
  header {
    display: flex;
    align-items: center;
    gap: 16px;
    padding: 10px 20px;
    border-bottom: 1px solid var(--border);
    background: var(--surface);
    flex-shrink: 0;
    flex-wrap: wrap;
  }

  .logo {
    font-family: 'IBM Plex Mono', monospace;
    font-weight: 600;
    font-size: 13px;
    background: linear-gradient(90deg, #38d8f0 0%, #a855f7 55%, #f472b6 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    letter-spacing: 0.08em;
    white-space: nowrap;
  }

  .sep { width: 1px; height: 20px; background: var(--border); }

  .stat {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11px;
    color: var(--muted);
    white-space: nowrap;
  }
  .stat span { color: var(--text); }

  .spacer { flex: 1; }

  label.upload-btn {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    padding: 6px 14px;
    background: linear-gradient(135deg, #38d8f0, #a855f7);
    color: #fff;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11px;
    font-weight: 600;
    cursor: pointer;
    border: none;
    transition: opacity .15s, box-shadow .15s;
    letter-spacing: 0.05em;
    white-space: nowrap;
    box-shadow: 0 0 12px rgba(56,216,240,.25), 0 0 24px rgba(168,85,247,.15);
  }
  label.upload-btn:hover { opacity: .9; box-shadow: 0 0 18px rgba(56,216,240,.4), 0 0 32px rgba(168,85,247,.25); }
  #file-input { display: none; }

  button.dl-btn {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    padding: 6px 14px;
    background: transparent;
    color: var(--accent);
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11px;
    font-weight: 600;
    cursor: pointer;
    border: 1px solid var(--accent);
    transition: all .15s;
    letter-spacing: 0.05em;
    white-space: nowrap;
    box-shadow: 0 0 8px rgba(56,216,240,.15);
  }
  button.dl-btn:hover { background: rgba(56,216,240,.08); box-shadow: 0 0 14px rgba(56,216,240,.3); }
  button.dl-btn:disabled { opacity: .35; cursor: default; box-shadow: none; }

  /* filter strip */
  .filters {
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 8px 20px;
    border-bottom: 1px solid var(--border);
    background: var(--surface);
    flex-shrink: 0;
    overflow-x: auto;
  }
  .filters label {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 10px;
    color: var(--muted);
    letter-spacing: .06em;
    margin-right: 4px;
    white-space: nowrap;
  }
  .filter-btn {
    padding: 3px 10px;
    background: transparent;
    border: 1px solid var(--border);
    color: var(--muted);
    font-family: 'IBM Plex Mono', monospace;
    font-size: 10px;
    cursor: pointer;
    transition: all .12s;
    white-space: nowrap;

  .side-palette {

  .side-palette-title {

    display: grid;

  .side-swatch {

  }

  /* Nav */
  .side-nav {
    display: flex;
    gap: 6px;

  .side-nav-btn {
    padding: 3px 10px;
    background: transparent;
    border: 1px solid var(--border);

  .side-nav-btn:disabled { opacity: .3; cursor: default; }
  .side-nav-info { flex:1; font-family:'IBM Plex Mono',monospace; font-size:9px; color:var(--muted); text-align:center; }

  /* Thumb editing highlight */
  .thumb.editing { border-color: var(--accent) !important; }

  /* ── SIZE GROUPS ─────────────────────────────────── */
  .size-group { margin-bottom: 10px; }
  .size-group-label {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 9px;
    color: var(--muted);
    margin-bottom: 5px;
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .size-tag {
    font-size: 8px; font-weight: 600; padding: 1px 5px;
    letter-spacing: .05em; font-family: 'IBM Plex Mono', monospace;
  }
  .size-tag-S   { background:#1a2e1a; color:#83E04D; border:1px solid #2a4a2a; }
  .size-tag-M   { background:#1a2a1e; color:#6EEEFF; border:1px solid #1a3a3a; }

  .size-tag-XL  { background:#1a1a2e; color:#f472b6; border:1px solid #2a1a4a; }
  .size-tag-XXL { background:#1e1a2e; color:#a855f7; border:1px solid #3a1a4a; }

  .size-badge {
    position: absolute;
    top: 2px; left: 2px;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 7px; font-weight: 600;
    padding: 1px 3px;
    background: rgba(0,0,0,.82);
    color: var(--accent);
    pointer-events: none;
    letter-spacing: .04em;
  }


  .side-stats-bar {
    font-family: 'IBM Plex Mono', monospace;

  .side-tool-btn.replace-active {
    border-color: #38A5FF;

</style>
</head>

// Side editor state

let sideHistory = [];
let sideCtx = null;
let sidePenDown = false;

// ── GLOBAL PALETTE ────────────────────────────────────
const GLOBAL_PALETTE = [
  "#A4A5A5","#F3DBFB","#FE61A1","#F0392D","#FFBCC6","#A34255",
  "#C96740","#FF7D13","#FFD1AB","#7E30BC","#5757B0","#5767F6",
  "#38A5FF","#6EEEFF","#FFD036","#FFF7A9","#3A855B","#83E04D",

function hexToRgb(h){ return [parseInt(h.slice(1,3),16),parseInt(h.slice(3,5),16),parseInt(h.slice(5,7),16)]; }
function rgbToLab(r,g,b){
  let rl=r/255,gl=g/255,bl=b/255;
  rl=rl>0.04045?((rl+0.055)/1.055)**2.4:rl/12.92;
  gl=gl>0.04045?((gl+0.055)/1.055)**2.4:gl/12.92;
  bl=bl>0.04045?((bl+0.055)/1.055)**2.4:bl/12.92;
  const x=rl*0.4124564+gl*0.3575761+bl*0.1804375;
  const y=rl*0.2126729+gl*0.7151522+bl*0.0721750;
  const z=rl*0.0193339+gl*0.1191920+bl*0.9503041;
  const f=v=>v>0.008856?Math.cbrt(v):7.787*v+16/116;
  const fx=f(x/0.95047),fy=f(y/1),fz=f(z/1.08883);
  return [116*fy-16,500*(fx-fy),200*(fy-fz)];
}

const GLOBAL_LAB = GLOBAL_RGB.map(([r,g,b])=>rgbToLab(r,g,b));

function reduceColorsToMapping(pixelData){
  const {data,width,height}=pixelData;
  const counts=new Map();
  for(let i=0;i<data.length;i+=4){
    if(data[i+3]>0){ const k=data[i]+','+data[i+1]+','+data[i+2]; counts.set(k,(counts.get(k)||0)+1); }
  }
  const sorted=Array.from(counts.entries()).sort((a,b)=>b[1]-a[1])
    .map(([k])=>{ const [r,g,b]=k.split(',').map(Number); return {r,g,b,k,lab:rgbToLab(r,g,b)}; });
  const c2g=new Map(); const used=new Set();
  for(const c of sorted){
    let best=0,md=Infinity;
    const [L1,a1,b1]=c.lab;
    for(let i=0;i<GLOBAL_LAB.length;i++){
      if(used.size<GLOBAL_LAB.length&&used.has(i)) continue;
      const [L2,a2,b2]=GLOBAL_LAB[i];
      const d=(L1-L2)**2+(a1-a2)**2+(b1-b2)**2;
      if(d<md){md=d;best=i;}
    }
    used.add(best); c2g.set(c.k,best);
  }
  return {colorToGlobalIdx:c2g, usedGlobalIndices:used};
}

// ── SIZE CATEGORIES ───────────────────────────────────
const SIZE_GROUPS=[
  {key:'S',  min:1,   max:250},
  {key:'M',  min:251, max:500},
  {key:'L',  min:501, max:900},
  {key:'XL', min:901, max:1200},
  {key:'XXL',min:1201,max:Infinity},
];
function sizeCategory(n){
  for(const g of SIZE_GROUPS) if(n>=g.min&&n<=g.max) return g.key;
  return n===0?'—':'XXL';
}
function getOpaqueCount(imageData){
  if(imageData.opaqueCount!==undefined) return imageData.opaqueCount;
  if(imageData.pixelData){ let n=0; const d=imageData.pixelData.data; for(let i=3;i<d.length;i+=4)if(d[i]>0)n++; imageData.opaqueCount=n; return n; }
  return 0;
}

// ── ZIP LOAD ──────────────────────────────────────────
fileInput.addEventListener('change', async e => {
  const files = Array.from(e.target.files); if(!files.length) return;
  await loadFiles(files); fileInput.value='';
});

async function loadFiles(files) {
  const zipFiles   = files.filter(f => f.name.endsWith('.zip'));
  const imageFiles = files.filter(f => /\.(png|jpe?g|gif|webp)$/i.test(f.name));
  if (zipFiles.length)   for (const z of zipFiles)   await loadZip(z);
  if (imageFiles.length) await loadImageFiles(imageFiles);
}

async function loadImageFiles(files) {
  showProgress('загружаем картинки…', 0);
  const total = files.length;
  for (let i = 0; i < total; i++) {
    const file = files[i];
    try {
      const blob = file;
      const name = file.name;
      const folder = 'uploaded';
      const path = folder + '/' + name;
      if (allImages.find(x => x.path === path)) { showProgress('загружаем ' + (i+1) + '/' + total, (i+1)/total); continue; }
      const imageData = await blobToImageData(blob);
      allImages.push({path, originalPath: path, originalFolder: folder, folder, name, blob, imageData});
    } catch(e) { console.warn('skip', file.name, e); }
    showProgress('загружаем ' + (i+1) + ' / ' + total, (i+1)/total);
    await new Promise(r => setTimeout(r, 0));
  }
  hideProgress();
  buildFilters(); renderGallery(); updateStats();
  dlBtn.disabled = false; filtersEl.style.display = 'flex';
  emptyState.style.display = 'none';
}

async function loadZip(file){
  allImages=[];
  showProgress('читаем архив…',0);
  let zip;
  try{ zip=await JSZip.loadAsync(file); }
  catch(e){ hideProgress(); alert('Не удалось открыть: '+e.message); return; }

  const imageExts=/\.(png|jpg|jpeg|gif|webp)$/i;
  const entries=[];
  zip.forEach((path,entry)=>{
    if(entry.dir) return;
    if(!imageExts.test(path)) return;
    const pts=path.split('/');
    if(pts.some(p=>p==='__MACOSX')) return;
    if(pts[pts.length-1].startsWith('._')) return;
    entries.push({path,entry});
  });
  if(!entries.length){ hideProgress(); alert('Нет картинок в архиве'); return; }

  const total=entries.length;
  showProgress('загружаем 0 / '+total,0);
  const BATCH=10;
  for(let i=0;i<total;i+=BATCH){
    const batch=entries.slice(i,i+BATCH);
    await Promise.all(batch.map(async({path,entry})=>{
      try{
        const blob=await entry.async('blob');
        const pts=path.split('/');
        const name=pts[pts.length-1];
        const folder=pts.length>=4?pts.slice(1,pts.length-1).join('/'):pts.slice(0,pts.length-1).join('/');
        const imageData=await blobToImageData(blob);
        allImages.push({path,originalPath:path,originalFolder:folder,folder,name,blob,imageData});
      }catch(e){ console.warn('skip',path,e); }
    }));
    showProgress('загружаем '+Math.min(i+BATCH,total)+' / '+total,Math.min(i+BATCH,total)/total);
    await new Promise(r=>setTimeout(r,0));
  }
  hideProgress();
  buildFilters(); renderGallery(); updateStats();
  dlBtn.disabled=false;
  filtersEl.style.display='flex';
  emptyState.style.display='none';
}

async function blobToImageData(blob){
  const dataUrl=await new Promise((res,rej)=>{ const r=new FileReader(); r.onload=()=>res(r.result); r.onerror=()=>rej(new Error('read fail')); r.readAsDataURL(blob); });
  const img=await new Promise((res,rej)=>{ const i=new Image(); i.onload=()=>res(i); i.onerror=()=>rej(new Error('img load failed')); i.src=dataUrl; });
  const w=img.naturalWidth,h=img.naturalHeight;
  const oc=document.createElement('canvas'); oc.width=w; oc.height=h;
  const octx=oc.getContext('2d'); octx.drawImage(img,0,0);
  const pixelData=octx.getImageData(0,0,w,h);
  const mapping=reduceColorsToMapping(pixelData);

  // Apply mapping → mapped pixel array
  const raw=pixelData.data;
  const mapped=new Uint8ClampedArray(raw.length);
  const {colorToGlobalIdx}=mapping;
  let opaqueCount=0;
  for(let i=0;i<raw.length;i+=4){
    if(raw[i+3]===0){ mapped[i]=mapped[i+1]=mapped[i+2]=mapped[i+3]=0; }
    else{
      opaqueCount++;
      const k=raw[i]+','+raw[i+1]+','+raw[i+2];
      const gi=colorToGlobalIdx.get(k);
      if(gi!==undefined){ const rgb=GLOBAL_RGB[gi]; mapped[i]=rgb[0];mapped[i+1]=rgb[1];mapped[i+2]=rgb[2];mapped[i+3]=255; }
      else{ mapped[i]=raw[i];mapped[i+1]=raw[i+1];mapped[i+2]=raw[i+2];mapped[i+3]=raw[i+3]; }
    }
  }
  const mappedData=new ImageData(mapped,w,h);
  const mc=document.createElement('canvas'); mc.width=w; mc.height=h;
  mc.getContext('2d').putImageData(mappedData,0,0);
  const mUrl=mc.toDataURL('image/png');
  const mappedImg=await new Promise((res,rej)=>{ const mi=new Image(); mi.onload=()=>res(mi); mi.onerror=rej; mi.src=mUrl; });

  // Pre-build mapped blob for download
  const bs=atob(mUrl.split(',')[1]); const ba=new Uint8Array(bs.length);
  for(let i=0;i<bs.length;i++) ba[i]=bs.charCodeAt(i);
  const mappedBlob=new Blob([ba],{type:'image/png'});

  return {img,w,h,pixelData:new ImageData(mapped,w,h),mapping,mappedImg,mappedBlob,opaqueCount};
}

function showProgress(msg,pct){ pbWrap.style.display='block'; pb.style.width=(pct*100)+'%'; progressText.textContent=msg; progressText.style.display='block'; }

// ── FILTERS ───────────────────────────────────────────
function buildFilters(){
  const allFolders=[...new Set(allImages.map(x=>x.folder))].sort();
  if(allImages._customFolders) allImages._customFolders.forEach(f=>{ if(!allFolders.includes(f)) allFolders.push(f); });
  const hasUnused=allFolders.includes('unused');
  const folders=hasUnused?['unused',...allFolders.filter(f=>f!=='unused')]:allFolders;
  filtersEl.innerHTML='';
  // + button first (before label)
  const plusBtn=document.createElement('button');
  plusBtn.id='add-folder-btn'; plusBtn.className='filter-btn add-folder-btn';
  plusBtn.textContent='+'; plusBtn.title='Создать папку';
  plusBtn.onclick=e=>{ e.stopPropagation(); const name=prompt('Название новой папки:'); if(!name||!name.trim()) return; const folder=name.trim().toLowerCase().replace(/[^a-zа-яё0-9_-]/gi,'_'); allImages._customFolders=allImages._customFolders||new Set(); allImages._customFolders.add(folder); buildFilters(); renderGallery(); currentFilter=folder; document.querySelectorAll('.filter-btn').forEach(b=>b.classList.toggle('active',b.dataset&&b.dataset.folder===folder)); };
  filtersEl.appendChild(plusBtn);
  filtersEl.appendChild(Object.assign(document.createElement('label'),{textContent:'ПАПКА:'}));
  const mkBtn=(label,val,isUnused)=>{
    const b=document.createElement('button');
    b.className='filter-btn'+(currentFilter===val?' active':'')+(isUnused?' unused-btn':'');
    b.textContent=label; b.dataset.folder=val;
    b.onclick=()=>{ currentFilter=val; document.querySelectorAll('.filter-btn').forEach(x=>x.classList.remove('active')); b.classList.add('active'); renderGallery(); };
    return b;
  };
  filtersEl.appendChild(mkBtn('все','all',false));
  folders.forEach(f=>filtersEl.appendChild(mkBtn(f.split('/').pop()||f,f,f==='unused')));
}

// ── GALLERY ───────────────────────────────────────────
function renderGallery(){
  while(galleryWrap.firstChild) galleryWrap.removeChild(galleryWrap.firstChild);
  const visible=allImages.filter(img=>currentFilter==='all'||img.folder===currentFilter);
  if(!visible.length){
    const msg=document.createElement('div'); msg.className='empty-state';
    msg.innerHTML='<div class="big">✓</div><div>нет картинок</div>';
    galleryWrap.appendChild(msg); return;
  }
  const byFolder={};
  visible.forEach(img=>{ if(!byFolder[img.folder]) byFolder[img.folder]=[]; byFolder[img.folder].push(img); });
  // Also include custom empty folders
  if(allImages._customFolders) allImages._customFolders.forEach(f=>{
    if(!byFolder[f]&&(currentFilter==='all'||currentFilter===f)) byFolder[f]=[];
  });

  const folderEntries=Object.entries(byFolder).sort(([a],[b])=>{
    if(a==='unused') return -1; if(b==='unused') return 1; return a.localeCompare(b);
  });

  folderEntries.forEach(([folder,imgs])=>{
    const section=document.createElement('div');
    section.className='folder-section'; section.dataset.folder=folder;

    section.addEventListener('dragover',e=>{ if(dragPath){ const d=allImages.find(x=>x.path===dragPath); if(d&&d.folder!==folder){e.preventDefault();section.classList.add('drag-target');} }});
    section.addEventListener('dragleave',e=>{ if(!section.contains(e.relatedTarget)) section.classList.remove('drag-target'); });
    section.addEventListener('drop',e=>{ if(!dragPath) return; e.preventDefault(); e.stopPropagation(); section.classList.remove('drag-target'); moveToFolder(dragPath,folder); dragPath=null; });

    const lbl=document.createElement('div'); lbl.className='folder-label';
    lbl.textContent=folder+'  ('+imgs.length+')'; section.appendChild(lbl);

    // Group by size, sort within each group
    const bySize={}; SIZE_GROUPS.forEach(g=>bySize[g.key]=[]);
    imgs.forEach(img=>{ const cat=sizeCategory(getOpaqueCount(img.imageData)); if(!bySize[cat]) bySize[cat]=[]; bySize[cat].push(img); });

    SIZE_GROUPS.forEach(g=>{
      const grp=bySize[g.key]; if(!grp||!grp.length) return;
      grp.sort((a,b)=>getOpaqueCount(a.imageData)-getOpaqueCount(b.imageData));
      const ge=document.createElement('div'); ge.className='size-group';
      const gl=document.createElement('div'); gl.className='size-group-label';
      const maxStr=g.max===Infinity?'∞':g.max;
      gl.innerHTML=`<span class="size-tag size-tag-${g.key}">${g.key}</span>${g.min}–${maxStr} · ${grp.length} шт`;
      ge.appendChild(gl);

      // LAZY RENDER: placeholder with exact height, render thumbs on intersection
      const grid=document.createElement('div'); grid.className='grid';
      const THUMB_PX = Math.round(Math.min(THUMB_MAX*SCALE, 384)) + 32; // approx thumb height
      const rendered = {done: false};

      function renderGroup(){
        if(rendered.done) return; rendered.done=true;
        grp.forEach(img=>grid.appendChild(makeThumbnail(img)));
      }

      if(currentFilter !== 'all' || grp.length < 80){
        // Small group or filtered view: render immediately
        renderGroup();
      } else {
        // Large group: lazy render on scroll into view
        const obs = new IntersectionObserver((entries)=>{
          entries.forEach(entry=>{ if(entry.isIntersecting){ renderGroup(); obs.disconnect(); }});
        }, {rootMargin:'200px'});
        obs.observe(grid);
      }

      ge.appendChild(grid); section.appendChild(ge);
    });
    galleryWrap.appendChild(section);
  }); // end folderEntries
}

function makeThumbnail(img){
  const{imageData,path,name}=img;
  const{w,h}=imageData;
  const scale=Math.min(SCALE,(THUMB_MAX*SCALE)/Math.max(w,h,1));
  const tw=Math.round(w*scale),th=Math.round(h*scale);
  const div=document.createElement('div');
  div.className='thumb'+(sideImg&&sideImg.path===path?' editing':'');
  div.title=path; div.draggable=true; div.dataset.path=path;
  const canvas=document.createElement('canvas'); canvas.width=tw; canvas.height=th;
  const ctx=canvas.getContext('2d'); ctx.imageSmoothingEnabled=false;
  ctx.drawImage(imageData.mappedImg||imageData.img,0,0,tw,th);
  div.appendChild(canvas);
  const dot=document.createElement('div'); dot.className='mark-dot'; div.appendChild(dot);
  const nameEl=document.createElement('div'); nameEl.className='name'; nameEl.textContent=name; div.appendChild(nameEl);
  const badge=document.createElement('div'); badge.className='size-badge'; badge.textContent=sizeCategory(getOpaqueCount(imageData)); div.appendChild(badge);

  div.addEventListener('click',()=>{ openSideEditor(allImages.indexOf(img)); });
  div.addEventListener('contextmenu',e=>{ e.preventDefault(); showContextMenu(e.clientX,e.clientY,img); });
  div.addEventListener('dragstart',e=>{ dragPath=path; div.classList.add('dragging'); e.dataTransfer.effectAllowed='move'; });
  div.addEventListener('dragend',()=>{ div.classList.remove('dragging'); dragPath=null; });
  return div;
}

// ── MOVE TO FOLDER ────────────────────────────────────
function moveToFolder(path,targetFolder){
  const img=allImages.find(x=>x.path===path);
  if(!img||img.folder===targetFolder) return;
  const parts=img.path.split('/'); const root=parts[0]; const filename=parts[parts.length-1];
  img.folder=targetFolder; img.path=root+'/'+targetFolder+'/'+filename;
  renderGallery(); updateStats();
}

// ── MOVE TO UNUSED ────────────────────────────────────
function moveToUnused(img) {
  if (img.folder === 'unused') return;
  const filename = img.path.split('/').pop();
  const oldPath = img.path;
  img.folder = 'unused';
  img.path = 'unused/' + filename;
  renderGallery();
  // If this image is open in editor, update nav info
  if (sideImg && sideImg.path === img.path) {
    sideEditorName.textContent = img.name;
  }
  updateStats();
}

// ── SIDE EDITOR ───────────────────────────────────────
function openSideEditor(idx){
  if(idx<0||idx>=allImages.length) return;

  // Commit current edits synchronously before switching
  if(sideImg && sidePixelData && sideImgIndex !== idx) {
    const commitImg=sideImg, commitPx=sidePixelData;
    const out=document.createElement('canvas');
    out.width=commitPx.width; out.height=commitPx.height;
    out.getContext('2d').putImageData(commitPx,0,0);
    const url=out.toDataURL('image/png');
    const bs=atob(url.split(',')[1]); const ba=new Uint8Array(bs.length);
    for(let i=0;i<bs.length;i++) ba[i]=bs.charCodeAt(i);
    const syncBlob=new Blob([ba],{type:'image/png'});
    commitImg.imageData.mappedBlob=syncBlob; commitImg.blob=syncBlob;
    // Also update mappedImg synchronously so re-opening shows edited version
    const mi=new Image();
    mi.onload=()=>{
      commitImg.imageData.mappedImg=mi; commitImg.imageData.img=mi;
      // Update thumb
      const th2=document.querySelector(`.thumb[data-path="${CSS.escape(commitImg.path)}"]`);
      if(th2){ const tc2=th2.querySelector('canvas'); if(tc2){
        const sc=Math.min(SCALE,(THUMB_MAX*SCALE)/Math.max(commitPx.width,commitPx.height,1));
        tc2.width=Math.round(commitPx.width*sc); tc2.height=Math.round(commitPx.height*sc);
        const cx=tc2.getContext('2d'); cx.imageSmoothingEnabled=false; cx.drawImage(mi,0,0,tc2.width,tc2.height);
      }}
    };
    mi.src=url;
  }

  sideImgIndex=idx; sideImg=allImages[idx]; sideHistory=[];
  sidePanelEmpty.style.display='none'; sideEditorEl.style.display='flex';
  sideEditorName.textContent=sideImg.name;
  sideNavInfo.textContent=(idx+1)+' / '+allImages.length;
  sideNavPrev.disabled=idx===0; sideNavNext.disabled=idx===allImages.length-1;

  const src=sideImg.imageData;
  const panelW=document.getElementById('side-panel').offsetWidth-4;
  const panelH=window.innerHeight*0.45;
  sideScale=Math.max(1,Math.min(24,Math.floor(Math.min(panelW/src.w,panelH/src.h))));
  sideCanvasEl.width=src.w*sideScale; sideCanvasEl.height=src.h*sideScale;
  sideCtx=sideCanvasEl.getContext('2d'); sideCtx.imageSmoothingEnabled=false;

  // Working copy — always from mappedImg/mappedBlob which reflects last commit
  const tmp=document.createElement('canvas'); tmp.width=src.w; tmp.height=src.h;
  const tc=tmp.getContext('2d'); tc.drawImage(src.mappedImg||src.img,0,0);
  sidePixelData=tc.getImageData(0,0,src.w,src.h);

  sidePushHistory(); sideRedraw(); buildSidePalette();
  sideToolUndo.disabled=true;
  updateSideStats();

  // Highlight thumbnail
  document.querySelectorAll('.thumb').forEach(t=>t.classList.remove('editing'));
  const th=document.querySelector(`.thumb[data-path="${CSS.escape(sideImg.path)}"]`);
  if(th) th.classList.add('editing');
}

function sidePushHistory(){
  sideHistory.push(new Uint8ClampedArray(sidePixelData.data));
  if(sideHistory.length>50) sideHistory.shift();
  sideToolUndo.disabled=sideHistory.length<=1;
}

function sideUndo(){
  if(sideHistory.length<=1) return;
  sideHistory.pop();
  sidePixelData.data.set(sideHistory[sideHistory.length-1]);
  sideRedraw(); sideToolUndo.disabled=sideHistory.length<=1;
  updateSideStats();
}

const sideTexCanvas = document.getElementById('side-texture-canvas');
const sideShowTexture = document.getElementById('side-show-texture');
sideShowTexture.addEventListener('change', () => { sideRedraw(); });

function sideRedraw(){
  const tmp=document.createElement('canvas'); tmp.width=sidePixelData.width; tmp.height=sidePixelData.height;
  tmp.getContext('2d').putImageData(sidePixelData,0,0);
  sideCtx.clearRect(0,0,sideCanvasEl.width,sideCanvasEl.height);
  sideCtx.drawImage(tmp,0,0,sideCanvasEl.width,sideCanvasEl.height);
  sideDrawTexture();
}

function sideDrawTexture(){
  const showTex = sideShowTexture.checked;
  sideTexCanvas.width  = sideCanvasEl.width;
  sideTexCanvas.height = sideCanvasEl.height;
  if(!showTex || !sidePixelData){ sideTexCanvas.style.display='none'; return; }
  sideTexCanvas.style.display='block';

  const sc = Math.max(1, Math.min(24, sideScale));
  const grayTile = TILE_GRAY_BY_SCALE[sc];
  if(!grayTile || !grayTile.complete){ sideTexCanvas.style.display='none'; return; }

  const tc = sideTexCanvas.getContext('2d');
  tc.clearRect(0,0,sideTexCanvas.width,sideTexCanvas.height);

  const d=sidePixelData.data, W=sidePixelData.width, H=sidePixelData.height;

  const colorGroups = new Map();
  for(let py=0;py<H;py++) for(let px=0;px<W;px++){
    const i4=(py*W+px)*4; if(d[i4+3]===0) continue;
    const key=d[i4]+','+d[i4+1]+','+d[i4+2];
    if(!colorGroups.has(key)) colorGroups.set(key,[]);
    colorGroups.get(key).push(px,py);
  }

  // Pass 1: flat palette colors
  tc.globalCompositeOperation = 'source-over';
  for(const [key, pts] of colorGroups){
    tc.fillStyle = 'rgb('+key+')';
    for(let j=0;j<pts.length;j+=2)
      tc.fillRect(pts[j]*sideScale, pts[j+1]*sideScale, sideScale, sideScale);
  }

  // Pass 2: overlay grayscale tile (mean=128, shadows darken, highlights lighten)
  tc.globalCompositeOperation = 'overlay';
  for(const [key, pts] of colorGroups){
    for(let j=0;j<pts.length;j+=2)
      tc.drawImage(grayTile, pts[j]*sideScale, pts[j+1]*sideScale);
  }
  tc.globalCompositeOperation = 'source-over';
}

function sideCommitSync(){
  if(!sideImg||!sidePixelData) return;
  // Capture by value NOW — sideImg/sidePixelData will change when next image opens
  const commitImg=sideImg;
  const commitPx=sidePixelData;

  const out=document.createElement('canvas'); out.width=commitPx.width; out.height=commitPx.height;
  out.getContext('2d').putImageData(commitPx,0,0);
  const url=out.toDataURL('image/png');
  const bs=atob(url.split(',')[1]); const ba=new Uint8Array(bs.length);
  for(let i=0;i<bs.length;i++) ba[i]=bs.charCodeAt(i);
  const newBlob=new Blob([ba],{type:'image/png'});

  let oc=0; const d=commitPx.data; for(let i=3;i<d.length;i+=4) if(d[i]>0) oc++;

  const mi=new Image();
  mi.onload=()=>{
    // Use captured commitImg — not global sideImg which already points to next image
    commitImg.blob=newBlob;
    commitImg.imageData={img:mi,mappedImg:mi,mappedBlob:newBlob,
      w:commitPx.width,h:commitPx.height,
      pixelData:commitPx,mapping:commitImg.imageData.mapping,opaqueCount:oc};
    const th=document.querySelector(`.thumb[data-path="${CSS.escape(commitImg.path)}"]`);
    if(th){ const tc=th.querySelector('canvas'); if(tc){
      const sc=Math.min(SCALE,(THUMB_MAX*SCALE)/Math.max(commitPx.width,commitPx.height,1));
      tc.width=Math.round(commitPx.width*sc); tc.height=Math.round(commitPx.height*sc);
      const tctx=tc.getContext('2d'); tctx.imageSmoothingEnabled=false; tctx.drawImage(mi,0,0,tc.width,tc.height);
      const badge=th.querySelector('.size-badge'); if(badge) badge.textContent=sizeCategory(oc);
    }}
  };
  mi.src=url;
}

function buildSidePalette(){
  sidePaletteGrid.innerHTML='';
  // Eraser
  const eSw=document.createElement('div');
  eSw.className='side-swatch eraser-sw'+(sideIsEraser?' active':'');
  eSw.title='Ластик'; eSw.style.background='';
  eSw.addEventListener('click',()=>{ sideIsEraser=true; sideSelIdx=null; updatePaletteSel(); updateColorBar(); });
  sidePaletteGrid.appendChild(eSw);
  // 21 colors
  GLOBAL_PALETTE.forEach((hex,i)=>{
    const sw=document.createElement('div');
    sw.className='side-swatch'+(!sideIsEraser&&sideSelIdx===i?' active':'');
    sw.style.background=hex; sw.dataset.idx=i; sw.title='#'+i+' '+hex;
    sw.addEventListener('click',()=>{
      if(sideTool==='replace'){
        if(replaceSrcIdx===null){
          // First click: pick source color
          replaceSrcIdx=i;
          document.querySelectorAll('.side-swatch').forEach(s=>s.classList.remove('replace-src'));
          sw.classList.add('replace-src');
        } else {
          // Second click: pick destination and replace
          if(replaceSrcIdx!==i){ replaceColor(replaceSrcIdx,i); }
          exitReplaceMode();
          // Restore fill mode
          sideTool='fill'; sideToolFill.classList.add('active');
          document.getElementById('side-tool-replace').classList.remove('active');
        }
        return;
      }
      sideIsEraser=false; sideSelIdx=i; updatePaletteSel(); updateColorBar();
    });
    sidePaletteGrid.appendChild(sw);
  });
  updateColorBar();
}

function updatePaletteSel(){
  sidePaletteGrid.querySelectorAll('.side-swatch').forEach((sw,i)=>{
    if(i===0) sw.classList.toggle('active',sideIsEraser);
    else sw.classList.toggle('active',!sideIsEraser&&parseInt(sw.dataset.idx)===sideSelIdx);
  });
}

function updateColorBar(){
  if(sideIsEraser){
    sideColorDot.style.background='';
    sideColorDot.className='side-color-dot eraser-dot';
    sideColorInfo.innerHTML='<b>ластик</b> — прозрачный';
  } else if(sideSelIdx!==null){
    const hex=GLOBAL_PALETTE[sideSelIdx];
    sideColorDot.style.background=hex;
    sideColorDot.className='side-color-dot';
    sideColorInfo.innerHTML=`<b>#${sideSelIdx}</b> ${hex}`;
  }
}

// Canvas interaction
function getPixelPos(e){
  const r=sideCanvasEl.getBoundingClientRect();
  return{px:Math.floor((e.clientX-r.left)/sideScale),py:Math.floor((e.clientY-r.top)/sideScale)};
}
function paintPixel(px,py){
  const W=sidePixelData.width,H=sidePixelData.height;
  if(px<0||px>=W||py<0||py>=H) return;
  const d=sidePixelData.data,i=(px+py*W)*4;
  if(sideIsEraser){d[i]=d[i+1]=d[i+2]=d[i+3]=0;}
  else{const rgb=GLOBAL_RGB[sideSelIdx];d[i]=rgb[0];d[i+1]=rgb[1];d[i+2]=rgb[2];d[i+3]=255;}
}
function floodFill(px,py){
  const d=sidePixelData.data,W=sidePixelData.width,H=sidePixelData.height;
  const i0=(px+py*W)*4;
  const tR=d[i0],tG=d[i0+1],tB=d[i0+2],tA=d[i0+3];
  let fR,fG,fB,fA;
  if(sideIsEraser){fR=fG=fB=fA=0;}
  else{const rgb=GLOBAL_RGB[sideSelIdx];fR=rgb[0];fG=rgb[1];fB=rgb[2];fA=255;}
  if(tR===fR&&tG===fG&&tB===fB&&tA===fA) return;
  const vis=new Uint8Array(W*H); const stack=[px+py*W]; vis[px+py*W]=1;
  while(stack.length){
    const cur=stack.pop(),cx=cur%W,cy=(cur/W)|0,ci=cur*4;
    d[ci]=fR;d[ci+1]=fG;d[ci+2]=fB;d[ci+3]=fA;
    for(let dy=-1;dy<=1;dy++) for(let dx=-1;dx<=1;dx++){
      if(!dx&&!dy) continue;
      const nx=cx+dx,ny=cy+dy;
      if(nx<0||nx>=W||ny<0||ny>=H) continue;
      const ni=nx+ny*W; if(vis[ni]) continue;
      const pi=ni*4; if(d[pi]===tR&&d[pi+1]===tG&&d[pi+2]===tB&&d[pi+3]===tA){vis[ni]=1;stack.push(ni);}
    }
  }
}

sideCanvasEl.addEventListener('mousedown',e=>{
  if(!sidePixelData||e.button!==0) return;
  const{px,py}=getPixelPos(e);
  if(sideTool==='fill'){ sidePushHistory(); floodFill(px,py); sideRedraw(); updateSideStats(); }
  else{ sidePenDown=true; sidePushHistory(); paintPixel(px,py); sideRedraw(); }
  e.preventDefault();
});
sideCanvasEl.addEventListener('mousemove',e=>{ if(!sidePenDown||sideTool!=='pen') return; const{px,py}=getPixelPos(e); paintPixel(px,py); sideRedraw(); });
sideCanvasEl.addEventListener('mouseup',()=>{ if(sidePenDown) updateSideStats(); sidePenDown=false; });
sideCanvasEl.addEventListener('mouseleave',()=>sidePenDown=false);

// ── REPLACE COLOR ─────────────────────────────────────
let replaceMode=false;   // waiting for src pick
let replaceSrcIdx=null;  // global palette index of color to replace

function exitReplaceMode(){
  replaceMode=false; replaceSrcIdx=null;
  document.getElementById('side-tool-replace').classList.remove('replace-active');
  document.querySelectorAll('.side-swatch').forEach(sw=>sw.classList.remove('replace-src'));
}

function replaceColor(srcIdx, dstIdx){
  const d=sidePixelData.data;
  const sr=GLOBAL_RGB[srcIdx], dr=GLOBAL_RGB[dstIdx];
  // Check if any pixels match src before modifying
  let found=false;
  for(let i=0;i<d.length;i+=4){
    if(d[i]===sr[0]&&d[i+1]===sr[1]&&d[i+2]===sr[2]&&d[i+3]===255){ found=true; break; }
  }
  if(!found) return;
  // Save history BEFORE modifying
  sidePushHistory();
  for(let i=0;i<d.length;i+=4){
    if(d[i]===sr[0]&&d[i+1]===sr[1]&&d[i+2]===sr[2]&&d[i+3]===255){
      d[i]=dr[0];d[i+1]=dr[1];d[i+2]=dr[2];
    }
  }
  sideRedraw(); updateSideStats();
}

// ── STATS ─────────────────────────────────────────────
function updateSideStats(){
  const statsBar=document.getElementById('side-stats-bar');
  if(!sidePixelData){ statsBar.style.display='none'; return; }
  const d=sidePixelData.data;
  const colorMap=new Map();
  let totalOpaque=0;
  for(let i=0;i<d.length;i+=4){
    if(d[i+3]===0) continue;
    totalOpaque++;
    const k=d[i]+','+d[i+1]+','+d[i+2];
    colorMap.set(k,(colorMap.get(k)||0)+1);
  }
  // Match to global palette for display
  const usedPal=new Map(); // globalIdx -> count
  for(const [k,cnt] of colorMap){
    const [r,g,b]=k.split(',').map(Number);
    const lab=rgbToLab(r,g,b);
    let best=0,md=Infinity;
    for(let i=0;i<GLOBAL_LAB.length;i++){
      const [L2,a2,b2]=GLOBAL_LAB[i];
      const dist=(lab[0]-L2)**2+(lab[1]-a2)**2+(lab[2]-b2)**2;
      if(dist<md){md=dist;best=i;}
    }
    usedPal.set(best,(usedPal.get(best)||0)+cnt);
  }
  const uniqueCount=usedPal.size;
  const lines=[...usedPal.entries()]
    .sort((a,b)=>b[1]-a[1])
    .map(([gi,cnt])=>`<span class="stats-item stats-color-sw" data-gi="${gi}" title="выбрать #${gi}" style="cursor:pointer"><span style="display:inline-block;width:8px;height:8px;background:${GLOBAL_PALETTE[gi]};border:1px solid #444;vertical-align:middle;margin-right:3px"></span><b>#${gi}</b> ${cnt}</span>`)
    .join('');
  statsBar.style.display='flex';
  statsBar.innerHTML=`<span class="stats-item">цветов: <b>${uniqueCount}</b></span><span class="stats-item">блоков: <b>${totalOpaque}</b></span>${lines}`;
  // Hook clicks on color swatches in stats bar
  statsBar.querySelectorAll('.stats-color-sw').forEach(sw=>{
    sw.addEventListener('click',()=>{
      const gi=parseInt(sw.dataset.gi);
      sideIsEraser=false; sideSelIdx=gi; updatePaletteSel(); updateColorBar();
    });
  });
}

// Tool buttons
const sideToolReplace = document.getElementById('side-tool-replace');
sideToolFill.onclick=()=>{ sideTool='fill'; exitReplaceMode(); sideToolFill.classList.add('active'); sideToolPen.classList.remove('active'); sideToolReplace.classList.remove('active'); };
sideToolPen.onclick=()=>{ sideTool='pen'; exitReplaceMode(); sideToolPen.classList.add('active'); sideToolFill.classList.remove('active'); sideToolReplace.classList.remove('active'); };
sideToolReplace.onclick=()=>{
  sideTool='replace'; replaceMode=true; replaceSrcIdx=null;
  sideToolReplace.classList.add('active','replace-active');
  sideToolFill.classList.remove('active'); sideToolPen.classList.remove('active');
};
sideToolUndo.onclick=()=>sideUndo();
const sideToolCrop = document.getElementById('side-tool-crop');
sideToolCrop.onclick=()=>{
  if(!sidePixelData) return;
  const d=sidePixelData.data, W=sidePixelData.width, H=sidePixelData.height;
  let minX=W,minY=H,maxX=0,maxY=0;
  for(let y=0;y<H;y++) for(let x=0;x<W;x++){
    const i=(y*W+x)*4;
    if(d[i+3]>0){ if(x<minX)minX=x; if(x>maxX)maxX=x; if(y<minY)minY=y; if(y>maxY)maxY=y; }
  }
  if(minX>maxX||minY>maxY){ alert('Нет непрозрачных пикселей'); return; }
  if(minX===0&&minY===0&&maxX===W-1&&maxY===H-1){ return; } // already tight
  sidePushHistory();
  const nW=maxX-minX+1, nH=maxY-minY+1;
  const cropped=new Uint8ClampedArray(nW*nH*4);
  for(let y=0;y<nH;y++) for(let x=0;x<nW;x++){
    const src=((y+minY)*W+(x+minX))*4, dst=(y*nW+x)*4;
    cropped[dst]=d[src];cropped[dst+1]=d[src+1];cropped[dst+2]=d[src+2];cropped[dst+3]=d[src+3];
  }
  sidePixelData=new ImageData(cropped,nW,nH);
  // Recompute scale for new dimensions
  const panelW=document.getElementById('side-panel').offsetWidth-4, panelH=window.innerHeight*0.45;
  sideScale=Math.max(1,Math.min(24,Math.floor(Math.min(panelW/nW,panelH/nH))));
  sideCanvasEl.width=nW*sideScale; sideCanvasEl.height=nH*sideScale;
  sideCtx=sideCanvasEl.getContext('2d'); sideCtx.imageSmoothingEnabled=false;
  sideRedraw(); updateSideStats();
};
sideNavPrev.onclick=()=>{ if(sideImgIndex>0) openSideEditor(sideImgIndex-1); };
sideNavNext.onclick=()=>{ if(sideImgIndex<allImages.length-1) openSideEditor(sideImgIndex+1); };

// ── PANEL RESIZE ─────────────────────────────────────
(function(){
  const handle = document.getElementById('panel-resize-handle');
  const panel  = document.getElementById('side-panel');
  if(!handle || !panel) return;
  let dragging=false, startX=0, startW=0;
  handle.addEventListener('mousedown', e=>{
    dragging=true; startX=e.clientX; startW=panel.offsetWidth;
    handle.classList.add('dragging');
    document.body.style.cursor='col-resize';
    document.body.style.userSelect='none';
    e.preventDefault(); e.stopPropagation();
  });
  document.addEventListener('mousemove', e=>{
    if(!dragging) return;
    const delta = startX - e.clientX;
    const newW = Math.max(200, Math.min(680, startW + delta));
    panel.style.width = newW + 'px';
    if(sideImg && sidePixelData){
      // Recompute scale but do NOT reload pixels — just rescale canvas
      const panelW=newW-4, panelH=window.innerHeight*0.45;
      const W=sidePixelData.width, H=sidePixelData.height;
      sideScale=Math.max(1,Math.min(24,Math.floor(Math.min(panelW/W,panelH/H))));
      sideCanvasEl.width=W*sideScale; sideCanvasEl.height=H*sideScale;
      sideCtx=sideCanvasEl.getContext('2d'); sideCtx.imageSmoothingEnabled=false;
      sideRedraw(); // redraws from sidePixelData — no data loss
    }
  });
  document.addEventListener('mouseup', ()=>{
    if(!dragging) return;
    dragging=false; handle.classList.remove('dragging');
    document.body.style.cursor=''; document.body.style.userSelect='';
  });
})();

// ── DRAG & DROP ONTO PAGE ─────────────────────────────
const dragOverlay = document.getElementById('drag-overlay');
let _dragTimer = null;
document.addEventListener('dragover', e => {
  if (!e.dataTransfer.types.includes('Files')) return;
  e.preventDefault();
  dragOverlay.style.display = 'flex';
  clearTimeout(_dragTimer);
  _dragTimer = setTimeout(() => { dragOverlay.style.display = 'none'; }, 150);
});
document.addEventListener('drop', async e => {
  e.preventDefault();
  clearTimeout(_dragTimer);
  dragOverlay.style.display = 'none';
  if (!e.dataTransfer.types.includes('Files')) return;
  if (dragPath) return;
  const files = Array.from(e.dataTransfer.files);
  if (files.length) await loadFiles(files);
});

// add-folder handled inline in buildFilters

// ── DOWNLOAD SCHEME ───────────────────────────────────
const sideToolScheme = document.getElementById('side-tool-scheme');
if (sideToolScheme) sideToolScheme.onclick = () => {
  if (!sidePixelData || !sideImg) return;
  // Just save the current mapped pixel data as a PNG (1px per game pixel)
  const out = document.createElement('canvas');
  out.width = sidePixelData.width; out.height = sidePixelData.height;
  out.getContext('2d').putImageData(sidePixelData, 0, 0);
  const a = document.createElement('a');
  a.href = out.toDataURL('image/png');
  a.download = sideImg.name.replace(/\.[^.]+$/, '') + '_mapped.png';
  a.click();
};

// Keyboard shortcuts
document.addEventListener('keydown',e=>{
  if(e.target.tagName==='INPUT') return;
  if((e.ctrlKey||e.metaKey)&&e.key==='z'){e.preventDefault();sideUndo();return;}
  if(e.key==='f'||e.key==='F'){sideToolFill.click();return;}
  if(e.key==='b'||e.key==='B'){sideToolPen.click();return;}
  if(e.key==='r'||e.key==='R'){sideToolReplace.click();return;}
  if(e.key==='e'||e.key==='E'){ sideIsEraser=true; sideSelIdx=null; updatePaletteSel(); updateColorBar(); return; }
  if(e.key==='ArrowRight'||e.key==='ArrowDown'){e.preventDefault();sideNavNext.click();return;}
  if(e.key==='ArrowLeft'||e.key==='ArrowUp'){e.preventDefault();sideNavPrev.click();return;}
  if(e.key==='Escape') lightbox.classList.remove('open');
});
